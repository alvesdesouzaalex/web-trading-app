<div class="max-w-lg mx-auto bg-white shadow-md rounded-lg p-6 mt-10">
    <h2 class="text-xl font-bold mb-4 text-gray-800">Send Bot Signal</h2>
    <form [formGroup]="signalForm" (ngSubmit)="onSubmit()" class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-gray-700">Ticker</label>
            <input type="text" formControlName="ticker"
                class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
                placeholder="BTCUSDT">
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700">Strategy</label>
            <input type="text" formControlName="strategy"
                class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
                placeholder="GRID">
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Indicator Value</label>
                <select formControlName="indicatorValue"
                    class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                    <option value="BUY">BUY</option>
                    <option value="SELL">SELL</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Trade Type</label>
                <select formControlName="tradeType"
                    class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                    <option value="LONG">LONG</option>
                    <option value="SHORT">SHORT</option>
                </select>
            </div>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700">Price (Optional)</label>
            <input type="text" formControlName="price"
                class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
        </div>

        <button type="submit" [disabled]="isLoading || signalForm.invalid"
            class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-green-600 hover:bg-green-700 focus:outline-none disabled:opacity-50">
            {{ isLoading ? 'Sending...' : 'Send Signal' }}
        </button>

        <div *ngIf="successMessage" class="text-green-600 text-center text-sm font-medium">
            {{ successMessage }}
        </div>
        <div *ngIf="errorMessage" class="text-red-600 text-center text-sm font-medium">
            {{ errorMessage }}
        </div>
    </form>
</div>
